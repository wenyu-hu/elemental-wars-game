<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale + user-scalable=no stop a double-tap or pinch from
       zooming the canvas mid-game; viewport-fit=cover lets the safe-area
       insets below push the HUD clear of a notch or home bar. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Elemental Wars</title>
  <!-- Declared explicitly as well as sitting at the default paths, so the
       browser doesn't have to guess. -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>
    // Cache-bust the stylesheets the same way the scripts below are.
    // Without this the dev server happily serves a stale style.css while
    // the JS is fresh, which reads as "my CSS change didn't work".
    // Injected from <head> so it still applies before first paint.
    (function () {
      const v = String(Date.now());
      ['style.css', 'status-sheet.css'].forEach(href => {
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = href + '?v=' + v;
        document.head.appendChild(l);
      });
    })();
  </script>
</head>
<body>
  <div id="game-container"></div>
  <div id="rotate-prompt">
    <div class="rp-icon">📱</div>
    <div class="rp-title">Turn your device sideways</div>
    <div class="rp-sub">Elemental Wars is played in landscape.</div>
  </div>

  <!-- Orientation can only be locked from fullscreen, so on a phone the
       game is entered through this gate.  Both APIs are best-effort: iOS
       Safari has no lockOrientation at all, and the rotate prompt above
       stays as the fallback for it. -->
  <div id="fullscreen-gate">
    <div class="fs-title">ELEMENTAL WARS</div>
    <button id="fs-play" type="button">▶ PLAY FULLSCREEN</button>
    <div class="fs-sub">Locks to landscape for the best fit.</div>
    <button id="fs-skip" type="button">Continue without fullscreen</button>
  </div>
  <script>
    (function () {
      const gate = document.getElementById('fullscreen-gate');
      const dismiss = () => gate.classList.add('gone');

      document.getElementById('fs-play').addEventListener('click', async () => {
        const el = document.documentElement;
        try {
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) await req.call(el);
        } catch (e) { /* refused — carry on windowed */ }
        try {
          // Not on iOS Safari, and throws on some Androids if the device
          // is already held the other way.  Never let it block entry.
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
          }
        } catch (e) { /* unsupported or refused */ }
        dismiss();
      });

      document.getElementById('fs-skip').addEventListener('click', dismiss);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script>
    // Cache-bust local sources so the dev server's no-cache-headers
    // setup doesn't serve stale JS to the browser.  No-op in
    // production where files would be hashed/versioned anyway.
    (function () {
      const v = String(Date.now());
      ['items.js', 'status-sheet.js', 'game.js'].forEach(src => {
        const s = document.createElement('script');
        s.src = src + '?v=' + v;
        s.async = false;
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
